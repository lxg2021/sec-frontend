# logic_group_template.yml
# 用户手工编辑的逻辑组织结构模板
# 层级说明：
# - 顶层：公司
# - 第二层：部门
# - 第三层：组
# - 第四层：用户自定义类型，可按需填写
# 每级缩进使用 2 个空格

- name: 总公司
  type: company
  children:
    - name: IT部
      type: department
      children:
        - name: 服务器组
          type: group
          children:
            - name: 数据库子组
              type: subgroup   # 用户可自定义类型
            - name: 应用子组
              type: subgroup
        - name: 网络组
          type: group
          children:
            - name: 核心网络节点
              type: node
        - name: 安全组
          type: group
          children:
            - name: 防火墙节点
              type: node
    - name: 财务部
      type: department
      children:
        - name: 会计组
          type: group
        - name: 审计组
          type: group
    - name: 人力资源部
      type: department
      children:
        - name: 招聘组
          type: group
        - name: 培训组
          type: group

- name: 分公司A
  type: company
  children:
    - name: 技术部
      type: department
      children:
        - name: 开发组
          type: group
          children:
            - name: 前端团队
              type: team
            - name: 后端团队
              type: team
        - name: 测试组
          type: group
    - name: 运营部
      type: department
      children:
        - name: 市场组
          type: group
        - name: 客服组
          type: group
