<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Attack workflow impact surface</title>
  <desc id="desc">A structured impact surface map showing one attack case connected to affected agents, instances, groups, and rules.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="caseFill" x1="270" y1="109" x2="450" y2="251" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEE2E2"/>
      <stop offset="1" stop-color="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="agentFill" x1="78" y1="52" x2="254" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="assetFill" x1="80" y1="214" x2="260" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#CFFAFE"/>
    </linearGradient>
    <linearGradient id="ruleFill" x1="468" y1="54" x2="642" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="groupFill" x1="468" y1="214" x2="642" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>

  <rect width="720" height="360" rx="24" fill="#F8FAFC"/>
  <rect x="18" y="18" width="684" height="324" rx="18" fill="white" stroke="#E2E8F0"/>

  <g opacity="0.85">
    <path d="M360 180 C290 84 228 96 178 104" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M360 180 C276 272 218 264 174 260" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M360 180 C430 84 492 96 542 104" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M360 180 C444 272 502 264 546 260" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 7"/>
  </g>

  <circle cx="360" cy="180" r="94" fill="#FFF1F2" stroke="#FFE4E6" stroke-width="1.5"/>
  <circle cx="360" cy="180" r="68" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="360" cy="180" r="42" fill="url(#caseFill)" stroke="#FB7185" stroke-width="2.2" filter="url(#softShadow)"/>

  <g stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M345 178h30"/>
    <path d="M360 163v30"/>
    <path d="M349 169l22 22"/>
    <path d="M371 169l-22 22"/>
  </g>
  <circle cx="360" cy="180" r="18" fill="#FFFFFF" stroke="#FB7185" stroke-width="1.8"/>
  <path d="M353.5 180.5 358.2 185.2 367.5 175.3" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="360" y="238" text-anchor="middle" fill="#881337" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Attack case</text>
  <text x="360" y="256" text-anchor="middle" fill="#9F1239" font-family="Inter, Arial, sans-serif" font-size="11">impact source</text>

  <g filter="url(#softShadow)">
    <rect x="58" y="54" width="198" height="96" rx="16" fill="url(#agentFill)" stroke="#BFDBFE"/>
    <rect x="464" y="54" width="198" height="96" rx="16" fill="url(#ruleFill)" stroke="#BBF7D0"/>
    <rect x="58" y="210" width="198" height="96" rx="16" fill="url(#assetFill)" stroke="#A5F3FC"/>
    <rect x="464" y="210" width="198" height="96" rx="16" fill="url(#groupFill)" stroke="#FDE68A"/>
  </g>

  <g>
    <circle cx="92" cy="92" r="18" fill="#2563EB"/>
    <path d="M85 96h14M88 90h8M90 86h4M87 100h10" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <text x="122" y="84" fill="#1E3A8A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Agents</text>
    <text x="122" y="103" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="11">affected endpoints</text>
    <text x="122" y="127" fill="#0F172A" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700">3</text>
    <text x="147" y="127" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11">hosts</text>
  </g>

  <g>
    <circle cx="498" cy="92" r="18" fill="#16A34A"/>
    <path d="M491 91.5 496.5 97 506 86.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M489 101h18" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
    <text x="528" y="84" fill="#14532D" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Rules</text>
    <text x="528" y="103" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="11">matched detections</text>
    <text x="528" y="127" fill="#0F172A" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700">5</text>
    <text x="553" y="127" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11">signals</text>
  </g>

  <g>
    <circle cx="92" cy="248" r="18" fill="#0891B2"/>
    <rect x="84.5" y="240.5" width="15" height="12" rx="2" stroke="white" stroke-width="1.8"/>
    <path d="M88 256h8M90 260h4" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <text x="122" y="240" fill="#164E63" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Instances</text>
    <text x="122" y="259" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="11">runtime objects</text>
    <text x="122" y="283" fill="#0F172A" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700">12</text>
    <text x="156" y="283" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11">items</text>
  </g>

  <g>
    <circle cx="498" cy="248" r="18" fill="#D97706"/>
    <path d="M490 249h16M498 241v16M492 243l12 12M504 243l-12 12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <text x="528" y="240" fill="#78350F" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Groups</text>
    <text x="528" y="259" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="11">business scope</text>
    <text x="528" y="283" fill="#0F172A" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700">2</text>
    <text x="553" y="283" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11">groups</text>
  </g>

  <g>
    <circle cx="255" cy="104" r="5" fill="#2563EB"/>
    <circle cx="465" cy="104" r="5" fill="#16A34A"/>
    <circle cx="255" cy="260" r="5" fill="#0891B2"/>
    <circle cx="465" cy="260" r="5" fill="#D97706"/>
    <circle cx="318" cy="137" r="4" fill="#FB7185"/>
    <circle cx="402" cy="137" r="4" fill="#FB7185"/>
    <circle cx="318" cy="223" r="4" fill="#FB7185"/>
    <circle cx="402" cy="223" r="4" fill="#FB7185"/>
  </g>

  <g>
    <rect x="281" y="32" width="158" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="300" cy="49" r="6" fill="#E11D48"/>
    <text x="315" y="53" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Impact surface</text>
  </g>

  <g>
    <rect x="284" y="294" width="152" height="34" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <path d="M306 304v14M299 311h14" stroke="#64748B" stroke-width="1.7" stroke-linecap="round"/>
    <text x="326" y="315" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">correlated by case_id</text>
  </g>
</svg>
