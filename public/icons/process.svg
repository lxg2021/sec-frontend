<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 外框阴影 -->
  <rect x="8" y="10" width="80" height="72" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="2"></rect>
  <!-- 标题栏 -->
  <rect x="8" y="10" width="80" height="12" rx="6" ry="6" fill="#e5e7eb"></rect>
  <!-- 左侧主内容区（蓝绿渐变） -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"></stop>
      <stop offset="100%" stop-color="#3b82f6"></stop>
    </linearGradient>
  </defs>
  <rect x="14" y="26" width="46" height="46" rx="3" fill="url(#g)" stroke="#c7d2fe" stroke-width="1"></rect>
  <!-- 渐变里的光滑弧形 -->
  <path d="M14 50 C 32 36, 44 36, 60 48 L60 72 L14 72 Z" fill="rgba(255,255,255,0.18)"></path>
  <!-- 右侧小面板（色块） -->
  <rect x="66" y="26" width="16" height="46" rx="2" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"></rect>
  <rect x="68" y="28" width="12" height="6" fill="#38bdf8"></rect>
  <rect x="68" y="36" width="12" height="6" fill="#34d399"></rect>
  <rect x="68" y="44" width="12" height="6" fill="#60a5fa"></rect>
  <rect x="68" y="52" width="12" height="6" fill="#22c55e"></rect>
  <rect x="68" y="60" width="12" height="6" fill="#0ea5e9"></rect>
  <!-- 右侧伪“文本行” -->
  <g fill="#e5e7eb">
    <rect x="14" y="76" width="46" height="2"></rect>
    <rect x="66" y="70" width="16" height="2"></rect>
  </g>
</svg>
