<svg width="320" height="220" viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-loader-title ai-loader-desc">
  <title id="ai-loader-title">AI 正在分析图谱</title>
  <desc id="ai-loader-desc">AI 正在读取当前 CASE 图谱并生成调查建议</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity=".22"/>
      <stop offset="58%" stop-color="#3B82F6" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="86" y1="35" x2="234" y2="183">
      <stop stop-color="#2563EB"/>
      <stop offset=".52" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="beam" x1="160" y1="110" x2="242" y2="110">
      <stop stop-color="#2563EB" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="50" y="0" width="220" height="220" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 .15 0 0 0 0 .39 0 0 0 0 .92 0 0 0 .35 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <style>
    .orbit {
      transform-origin: 160px 110px;
      animation: spin 5.2s linear infinite;
    }
    .orbit-slow {
      transform-origin: 160px 110px;
      animation: spinReverse 7.5s linear infinite;
    }
    .beam {
      transform-origin: 160px 110px;
      animation: sweep 2.4s cubic-bezier(.45,0,.2,1) infinite;
    }
    .pulse {
      transform-origin: center;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .flow {
      stroke-dasharray: 4 12;
      animation: flow 1.15s linear infinite;
    }
    .dot {
      animation: dot 2.2s ease-in-out infinite;
    }
    .d2 { animation-delay: .22s; }
    .d3 { animation-delay: .44s; }
    .d4 { animation-delay: .66s; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      to { transform: rotate(-360deg); }
    }
    @keyframes sweep {
      0% { transform: rotate(-35deg); opacity: 0; }
      15% { opacity: .95; }
      76% { opacity: .95; }
      100% { transform: rotate(325deg); opacity: 0; }
    }
    @keyframes flow {
      to { stroke-dashoffset: -16; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .88; }
      50% { transform: scale(1.045); opacity: 1; }
    }
    @keyframes dot {
      0%, 100% { transform: scale(1); opacity: .56; }
      50% { transform: scale(1.22); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit,
      .orbit-slow,
      .beam,
      .pulse,
      .flow,
      .dot {
        animation: none;
      }
    }
  </style>
  <rect width="320" height="220" fill="transparent"/>
  <circle cx="160" cy="110" r="86" fill="url(#halo)"/>
  <g opacity=".55">
    <path d="M92 110H228" stroke="#E2E8F0"/>
    <path d="M160 42V178" stroke="#E2E8F0"/>
    <path d="M112 62L208 158" stroke="#E2E8F0"/>
    <path d="M208 62L112 158" stroke="#E2E8F0"/>
  </g>
  <g>
    <path class="flow" d="M101 84C122 62 151 56 179 67C202 76 215 94 224 116" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round"/>
    <path class="flow" d="M96 132C124 162 170 172 205 146C220 135 228 121 232 101" stroke="#99F6E4" stroke-width="1.8" stroke-linecap="round"/>
    <path class="flow" d="M118 146C112 119 118 94 139 78C158 64 182 64 203 77" stroke="#BAE6FD" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g class="beam">
    <path d="M160 110L244 77A90 90 0 0 1 246 143L160 110Z" fill="url(#beam)"/>
  </g>
  <g filter="url(#glow)">
    <circle class="orbit" cx="160" cy="110" r="56" stroke="url(#ring)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="64 42"/>
    <circle class="orbit-slow" cx="160" cy="110" r="39" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="18 20" opacity=".78"/>
    <circle class="pulse" cx="160" cy="110" r="23" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <path d="M150 117V103C150 99.7 152.7 97 156 97H164C167.3 97 170 99.7 170 103V117" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M150 109H170" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M143 103H150M170 103H177M143 117H150M170 117H177" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <circle class="dot d1" cx="101" cy="84" r="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <circle class="dot d2" cx="224" cy="116" r="5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
    <circle class="dot d3" cx="96" cy="132" r="5" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle class="dot d4" cx="203" cy="77" r="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="160" y="202" text-anchor="middle" fill="#0F172A" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="600">AI 正在分析图谱</text>
</svg>
